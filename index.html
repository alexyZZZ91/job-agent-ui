<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Job Agent</title>
<style>
  :root{--bg:#f4f6f8;--card:#fff;--text:#1a1a1a;--muted:#5b6470;--line:#d5dae2;--brand:#1a237e;--ok:#2e7d32;--warn:#7a5b00;--warnbg:#fff3cd;--bad:#c62828;--chip:#e3e7ee}
  @media (prefers-color-scheme:dark){:root{--bg:#10131a;--card:#1a1f2a;--text:#e8ebf2;--muted:#9aa4b5;--line:#2c3444;--brand:#7986cb;--ok:#66bb6a;--warn:#ffd54f;--warnbg:#3a3000;--bad:#ef5350;--chip:#262d3b}}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--brand);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  @media (prefers-color-scheme:dark){header{color:#10131a}}
  header h1{font-size:17px;margin:0;flex:1}
  header button{background:rgba(255,255,255,.2);color:inherit;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
  main{max-width:900px;margin:0 auto;padding:0 16px 48px}
  nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0}
  nav button{border:0;border-radius:16px;padding:6px 12px;background:var(--chip);color:var(--text);cursor:pointer;font-size:13px}
  nav button.on{background:var(--brand);color:#fff}
  @media (prefers-color-scheme:dark){nav button.on{color:#10131a}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
  .meta{font-size:13px;color:var(--muted);margin-bottom:6px;overflow-wrap:anywhere}
  .tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;margin-left:4px}
  .tag.warn{background:var(--warnbg);color:var(--warn)} .tag.ok{background:var(--chip);color:var(--ok)}
  select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit}
  ul{margin:6px 0;padding-left:20px}
  input,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;margin:3px 0 8px}
  textarea{min-height:200px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;background:var(--chip);color:var(--text)}
  .btn.approve{background:var(--ok);color:#fff} .btn.skip{background:var(--muted);color:#fff}
  .login{max-width:360px;margin:12vh auto;padding:0 16px}
  .note{font-size:13px;color:var(--muted);margin:6px 0 0}
  .err{color:var(--bad);font-size:14px;min-height:20px}
  table{width:100%;border-collapse:collapse;font-size:14px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  .score{font-weight:700} a{color:var(--brand)}
  @media (prefers-color-scheme:dark){a{color:#9fa8da}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Public by design: the publishable key only works together with your login + row-level security.
const SUPABASE_URL = "https://xllafcnijtpoaifytwxa.supabase.co";
const SUPABASE_KEY = "sb_publishable_vig-hcndK9BIJE9hUudfpw_pGGJdLLh";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (h) => { const d = document.createElement("div"); d.innerHTML = h; return d.firstElementChild; };
const esc = (s) => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app = document.getElementById("app");
let view = "outreach", tab = "pending", items = [], roles = [], apps = [], minScore = 6;
const APP_STATUSES = ["applied","screen","interview","offer","rejected","withdrawn"];
const TABS = ["pending","approved","sent","replied","autoreply","bounced","skipped"];

async function boot() {
  const { data } = await sb.auth.getSession();
  data.session ? await load() : loginScreen();
}

function loginScreen(msg = "") {
  app.innerHTML = `<div class="login"><h2>Job Agent</h2>
    <input id="em" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="err">${esc(msg)}</div>
    <button class="btn approve" id="go">Sign in</button></div>`;
  const go = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: document.getElementById("em").value.trim(),
                                                         password: document.getElementById("pw").value });
    error ? loginScreen("Sign-in failed.") : load();
  };
  document.getElementById("go").onclick = go;
  document.getElementById("pw").onkeydown = (e) => e.key === "Enter" && go();
}

async function load() {
  const [i, r, a] = await Promise.all([
    sb.from("outreach_items").select("*").order("updated_at", { ascending: false }),
    sb.from("roles").select("data"),
    sb.from("applications").select("*").order("applied_at", { ascending: false }),
  ]);
  if (i.error || r.error) { return loginScreen("Could not load data — try signing in again."); }
  items = i.data.map(x => ({ ...x.data, ...x }));
  roles = r.data.map(x => x.data);
  apps = a.error ? [] : a.data;          // table may not exist until applications.sql has been run
  render();
}

function render() {
  const counts = Object.fromEntries(TABS.map(t => [t, items.filter(i => i.status === t).length]));
  app.innerHTML = `<header><h1>Job Agent</h1>
      <button id="vo">Outreach</button><button id="va">Applications (${apps.length})</button><button id="vr">Roles</button>
      <button id="rf">Refresh</button><button id="so">Sign out</button></header><main id="m"></main>`;
  const g = (id) => document.getElementById(id);
  g("vo").onclick = () => { view = "outreach"; render(); }; g("vr").onclick = () => { view = "roles"; render(); };
  g("va").onclick = () => { view = "apps"; render(); };
  g("rf").onclick = load; g("so").onclick = async () => { await sb.auth.signOut(); loginScreen(); };
  const m = document.getElementById("m");
  if (view === "roles") return renderRoles(m);
  if (view === "apps") return renderApps(m);
  m.innerHTML = `<nav>${TABS.map(t => `<button class="${t===tab?"on":""}" data-t="${t}">${t} (${counts[t]})</button>`).join("")}</nav>
    <p class="note">Approved emails are sent automatically on weekdays at about 10:30 and 15:30 UK time (max per day applies). Sent emails can't be edited.</p>
    <div id="list"></div>`;
  m.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  const list = document.getElementById("list");
  const shown = items.filter(i => i.status === tab);
  if (!shown.length) list.innerHTML = "<p>Nothing here.</p>";
  shown.sort((a, b) => (b.score || 0) - (a.score || 0)).forEach(i => list.appendChild(card(i)));
}

function card(i) {
  const editable = i.status === "pending" || i.status === "approved";
  const conf = i.email_confidence === "guessed" ? `<span class="tag warn">guessed address — bounce risk</span>` : `<span class="tag ok">${esc(i.email_confidence)}</span>`;
  const el = $(`<div class="card">
    <div class="meta"><b>${esc(i.company)}</b> — ${esc(i.role_title)} ${i.score ? `(${i.score}/10)` : ""} · ${esc(i.kind)}
      ${i.role_url ? ` · <a href="${esc(i.role_url)}" target="_blank" rel="noopener">posting</a>` : ""}
      ${i.not_before && new Date(i.not_before) > new Date() ? ` · <b>holds until ${esc(new Date(i.not_before).toLocaleString())}</b>` : ""}</div>
    <div class="meta">To: <b>${esc(i.to_name)}</b> ${esc(i.to_title)} (${esc(i.to_type)}) ${conf}</div>
    <input class="to" value="${esc(i.to_email)}" ${editable ? "" : "disabled"}>
    <input class="sub" value="${esc(i.subject)}" ${editable ? "" : "disabled"}>
    <textarea class="body" ${editable ? "" : "disabled"}>${esc(i.body)}</textarea>
    ${i.reply_subject ? `<div class="meta">Reply: ${esc(i.reply_from)} — ${esc(i.reply_subject)}</div>` : ""}
    ${i.error ? `<div class="meta" style="color:var(--bad)">Last send error: ${esc(i.error)}</div>` : ""}
    ${i.sent_at ? `<div class="meta">Sent ${esc(new Date(i.sent_at).toLocaleString())}</div>` : ""}
    <div class="row"></div></div>`);
  const row = el.querySelector(".row");
  const add = (label, cls, status) => {
    const b = $(`<button class="btn ${cls}">${label}</button>`);
    b.onclick = async () => {
      b.disabled = true;
      const patch = { to_email: el.querySelector(".to").value.trim(), subject: el.querySelector(".sub").value.trim(),
                      body: el.querySelector(".body").value };
      if (status) patch.status = status;
      const { error } = await sb.from("outreach_items").update(patch).eq("id", i.id);
      if (error) { alert("Save failed: " + error.message); b.disabled = false; return; }
      load();
    };
    row.appendChild(b);
  };
  if (i.status === "pending") add("Approve", "approve", "approved");
  if (i.status === "approved") add("Back to pending", "", "pending");
  if (editable) { add("Save edits", "", null); add("Skip", "skip", "skipped"); }
  return el;
}

function renderRoles(m) {
  m.innerHTML = `<nav><button class="on">Roles</button></nav>
    <p class="note">Min score: <input id="ms" type="number" min="1" max="10" value="${minScore}" style="width:70px;display:inline"></p>
    <p class="note">Apply on the company site or LinkedIn first, then press <b>Applied</b> — I'll find the right people and draft the follow-up.</p>
    <div class="card"><table><thead><tr><th>Score</th><th>Company</th><th>Role</th><th>Location</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const done = new Map(apps.map(a => [a.role_id, a]));
  const draw = () => {
    const rows = roles.filter(r => (r.score || 0) >= minScore).sort((a, b) => (b.score || 0) - (a.score || 0));
    document.getElementById("tb").innerHTML = rows.map(r => `<tr><td class="score">${r.score}</td><td>${esc(r.company)}</td>
      <td><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></td><td>${esc((r.location || "").slice(0, 40))}</td>
      <td>${done.has(r.id) ? `<span class="tag ok">Applied ✓</span>` : `<button class="btn approve applyBtn" data-id="${esc(r.id)}">Applied</button>`}</td></tr>`).join("");
    document.querySelectorAll(".applyBtn").forEach(b => b.onclick = async () => {
      const r = roles.find(x => x.id === b.dataset.id);
      if (!confirm(`Mark "${r.title}" at ${r.company} as applied?\n\nI'll build an outreach pack for it (contacts, drafted emails for your review, LinkedIn note).`)) return;
      b.disabled = true;
      const { error } = await sb.from("applications").insert({ role_id: r.id, company: r.company, title: r.title, url: r.url,
        score: r.score, status: "applied", applied_at: new Date().toISOString() });
      if (error) { alert("Couldn't save: " + error.message); b.disabled = false; return; }
      window._pollN = 0; view = "apps";      // jump to the Applications tab to watch the pack build
      load();
    });
  };
  document.getElementById("ms").onchange = (e) => { minScore = +e.target.value || 1; draw(); };
  draw();
}

function renderApps(m) {
  m.innerHTML = `<nav><button class="on">Applications (${apps.length})</button></nav>
    <p class="note">Outreach packs usually build within a minute or two of pressing Applied (at worst within the hour); this page refreshes itself while one is building. Drafted emails appear on the <b>Outreach</b> tab (held for 24h after you applied) for you to approve.</p>
    <div class="card"><b>Applied somewhere that isn't in the Roles list?</b>
      <div class="note">Paste the link to the job posting. I'll read it, score it, find the hiring manager / recruiter and draft the follow-up (picked up within the hour).</div>
      <input id="lk" placeholder="https://... link to the job posting" autocomplete="off">
      <div class="row"><input id="lc" style="flex:1;min-width:160px" placeholder="Company (optional - helps if the link can't be read)">
      <input id="lt" style="flex:1;min-width:160px" placeholder="Role title (optional)"></div>
      <div class="row"><button class="btn approve" id="lgo">I applied - find contacts</button></div></div>
    <div id="alist"></div>`;
  document.getElementById("lgo").onclick = addLinkApplication;
  // while a pack is still building, re-check every 15s (up to ~3 minutes) so it appears without a manual refresh
  clearTimeout(window._poll);
  const building = apps.some(a => !(a.pack && (a.pack.generated_at || a.pack.link_error)));
  if (building && (window._pollN = (window._pollN || 0) + 1) <= 12) window._poll = setTimeout(load, 15000);
  const list = document.getElementById("alist");
  if (!apps.length) { list.innerHTML = "<p>No applications yet. Apply for a role, then press <b>Applied</b> on the Roles tab, or paste a link above.</p>"; return; }
  apps.forEach(a => list.appendChild(appCard(a)));
}

async function sha10(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 10);
}

async function addLinkApplication() {
  const url = document.getElementById("lk").value.trim();
  if (!/^https?:\/\/\S+$/i.test(url)) { alert("Please paste a full link starting with http:// or https://"); return; }
  const id = "link::" + await sha10(url);
  if (apps.some(a => a.role_id === id)) { alert("You've already added that link."); return; }
  const btn = document.getElementById("lgo"); btn.disabled = true;
  const { error } = await sb.from("applications").insert({
    role_id: id, url, status: "applied", applied_at: new Date().toISOString(),
    company: document.getElementById("lc").value.trim() || "(reading link...)",
    title: document.getElementById("lt").value.trim() || "(reading link...)",
  });
  if (error) { alert("Couldn't save: " + error.message); btn.disabled = false; return; }
  window._pollN = 0; view = "apps";
  load();
}

function appCard(a) {
  const p = a.pack || {};
  const contacts = (p.contacts || []).map(c => `<li><b>${esc(c.name)}</b>, ${esc(c.title)} — ${esc(c.email)}
      <span class="tag ${c.confidence === "guessed" ? "warn" : "ok"}">${esc(c.confidence)}</span> ${esc(c.type)}
      ${c.item_id ? "· email drafted (see Outreach)" : `· ${esc(c.note || "")}`}</li>`).join("");
  const li = p.linkedin || {};
  const links = (li.search_links || []).map(l => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a></li>`).join("");
  const isLink = a.role_id.startsWith("link::"), reading = (a.company || "").startsWith("(reading");
  const pack = p.link_error ? `<div class="note" style="margin-top:10px;color:var(--bad)">${esc(p.link_error)}</div>`
    : reading && !p.generated_at ? `<div class="note" style="margin-top:10px">Reading the link and scoring the role - this happens within the hour.</div>`
    : p.generated_at ? `
      <div class="meta" style="margin-top:10px"><b>Outreach pack</b> (built ${esc(new Date(p.generated_at).toLocaleString())})</div>
      ${contacts ? `<ul>${contacts}</ul>` : ""}
      ${p.score_note ? `<div class="note">${esc(p.score_note)}</div>` : ""}
      ${p.hunter_note ? `<div class="note">${esc(p.hunter_note)}</div>` : ""}
      ${li.note ? `<div class="meta">LinkedIn connection note <button class="btn cp" data-t="note">Copy</button></div><div class="card" style="margin:4px 0">${esc(li.note)}</div>` : ""}
      ${li.dm ? `<div class="meta">LinkedIn follow-up message <button class="btn cp" data-t="dm">Copy</button></div><div class="card" style="margin:4px 0;white-space:pre-wrap">${esc(li.dm)}</div>` : ""}
      ${links ? `<div class="meta">Find people on LinkedIn:</div><ul>${links}</ul>` : ""}
      ${p.manual_note ? `<div class="note">${esc(p.manual_note)}</div>` : ""}`
    : `<div class="note" style="margin-top:10px">Outreach pack not built yet — it builds within the hour (or at the next scheduled run).</div>`;
  const el = $(`<div class="card">
    <div class="meta"><b>${esc(a.company)}</b> — <a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a> ${a.score ? `(${a.score}/10)` : ""}
      ${a.score == null && p.generated_at ? `<span class="tag warn">not scored</span>` : ""}
      · applied ${esc(new Date(a.applied_at).toLocaleDateString())}</div>
    ${isLink && (p.link_error || reading) ? `<div class="row"><input class="ca" style="flex:1;min-width:150px" placeholder="Company" value="${reading ? "" : esc(a.company)}">
      <input class="ti" style="flex:1;min-width:150px" placeholder="Role title" value="${reading ? "" : esc(a.title)}"></div>` : ""}
    <div class="row" style="align-items:center"><select class="st">${APP_STATUSES.map(s => `<option ${s === a.status ? "selected" : ""}>${s}</option>`).join("")}</select></div>
    <div class="meta" style="margin-top:8px">Notes</div><textarea class="nt" style="min-height:60px">${esc(a.notes)}</textarea>
    <div class="meta">Contact I found (paste a name + title, a LinkedIn URL, or an email — I'll draft a note to them)</div>
    <input class="mc" value="${esc(a.manual_contact)}" placeholder="e.g. Jane Smith, VP Infrastructure — linkedin.com/in/janesmith">
    <div class="row"><button class="btn save">Save</button></div>${pack}</div>`);
  el.querySelector(".save").onclick = async (ev) => {
    ev.target.disabled = true;
    const patch = { status: el.querySelector(".st").value, notes: el.querySelector(".nt").value,
                    manual_contact: el.querySelector(".mc").value.trim() };
    const ca = el.querySelector(".ca"), ti = el.querySelector(".ti");
    if (ca && ca.value.trim()) patch.company = ca.value.trim();
    if (ti && ti.value.trim()) patch.title = ti.value.trim();
    const { error } = await sb.from("applications").update(patch).eq("role_id", a.role_id);
    if (error) { alert("Save failed: " + error.message); ev.target.disabled = false; return; }
    load();
  };
  el.querySelectorAll(".cp").forEach(b => b.onclick = () => { navigator.clipboard.writeText(li[b.dataset.t] || ""); b.textContent = "Copied"; });
  return el;
}

boot();
</script>
</body>
</html>
